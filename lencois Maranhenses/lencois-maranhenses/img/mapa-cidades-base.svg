<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <title>Mapa esquemático das cidades de acesso ao parque</title>
  <rect width="800" height="400" fill="#eaf6fb"/>
  <path d="M0 0 H800 V90 C640 120 480 70 320 105 C200 130 90 95 0 120 Z" fill="#7cc4ef"/>
  <text x="400" y="45" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0d4f66">Oceano Atlântico</text>
  <rect x="210" y="125" width="360" height="130" rx="20" fill="#f4efe4" stroke="#b9ab8f" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="390" y="195" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#6b5b3d">Parque Nacional</text>
  <circle cx="160" cy="250" r="9" fill="#c0392b"/>
  <text x="160" y="280" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222">Santo Amaro</text>
  <circle cx="590" cy="290" r="9" fill="#c0392b"/>
